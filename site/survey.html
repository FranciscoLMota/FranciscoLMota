<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./public/img/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./public/img/favicon.svg">
    <link rel="shortcut icon" href="./public/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/img/apple-touch-icon.png">
    <link rel="manifest" href="./public/img/site.webmanifest">
    <meta name="author" content="FranciscoLMota">
    <meta name="description" content="A webpage for a CSD112 lab">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/normalize.css">
    <link rel="stylesheet" href="style/main.css">
    <script src="scripts/main.js"></script>
    <title>Francisco's Web Page</title>
</head>

<body>
    <div class="width-wrap">
        <header id="top">
            <nav>
                <ul class="menu">
                    <li class="nav"><a href="index.html">Home</a></li>
                    <li class="nav"><a href="links.html">Links</a></li>
                    <li class="nav"><a href="glossary.html">Glossary</a></li>
                    <li class="nav"><a href="survey.html">Survey</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div id="creating-a-web-form">
                <h1>Survey</h1>
                <form action="https://formspree.io/f/xjkayjlv" method="POST">
                    <p>
                        <label for="name_field">What's your name?</label>
                        <input type="text" id="name_field" name="name_field" aria-required="true" required>
                    </p>
                    <p>
                        <label for="email_field">What's your email?</label>
                        <input type="text" id="email_field" name="email_field" aria-required="true" required>
                    </p>
                    <p>
                        <label for="best_whole_number">Which whole number is best?</label>
                        <input type="number" id="best_whole_number" name="best_whole_number" min="1">
                    </p>
                    <p>
                        <label for="best_day">Which day is best?</label>
                        <input type="date" id="best_day" name="best_day">
                    </p>
                    <p>
                        <label for="best_bear">Which bear is best?</label>
                        <select name="best_bear" id="best_bear">
                            <option value="">&nbsp;</option>
                            <option value="Black">Black</option>
                            <option value="Brown">Brown</option>
                            <option value="Care">Care</option>
                            <option value="Panda">Panda</option>
                            <option value="Polar">Polar</option>
                            <option value="Teddy">Teddy</option>
                        </select>
                    </p>
                    <fieldset>
                        <legend>Do you like radio buttons?</legend>
                        <ul style="list-style-type: none;">
                            <li class="custom-radio">
                                <input type="radio" id="yes" name="enjoys_radio_buttons" value="yes">
                                <label for="yes">Yes</label><br>
                            </li>
                            <li>
                                <input type="radio" id="no" name="enjoys_radio_buttons" value="no">
                                <label for="no">No</label><br>
                            </li>
                            <li>
                                <input type="radio" id="?" name="enjoys_radio_buttons" value="?" checked>
                                <label for="?">None of your business</label><br>
                            </li>
                        </ul>
                    </fieldset>
                    <p>
                        <label for="life_meaning">What is the meaning of life?</label><br>
                        <textarea name="life_meaning" rows="5" cols="50"
                            placeholder="Insert the correct answer here."></textarea>
                    </p>
                    <p>
                        <input type="submit" value="Submit">
                    </p>
                </form>
            </div>
        </main>
        <br>
        <footer>
            <hr>

            <blockquote cite="http://www.worldwildlife.org/who/index.html">
                "My fake plants died because I did not pretend to water them."
                <br><cite>
                    &#8212; <span class="author">Mitch Hedberg</span>
                </cite>
            </blockquote>
        </footer>
        <a href="#top" title="Back to top">&#x21d1;</a>
    </div>
</body>

</html>
